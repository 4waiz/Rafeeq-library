# Named joint poses for the Rafeeq manipulation node.
#
# The reach_row_* and place poses below are SOLVED, not guessed. They come
# from scripts/solve_arm_poses.py, which runs damped least-squares IK against
# the competition URDF via rafeeq_solution/kinematics.py. That FK was
# validated against the running simulator across three arbitrary arm
# configurations and matched to 0.07 mm.
#
# Regenerate them whenever the standoff distances or shelf geometry change:
#
#     python3 scripts/solve_arm_poses.py
#
# Solver residuals at the time of writing (position / finger tilt):
#     reach_row_1  0.41 mm  4.0 deg      reach_row_3  0.61 mm  0.1 deg
#     reach_row_2  0.99 mm  4.4 deg      reach_row_4  0.39 mm  0.0 deg
#     place        0.19 mm  0.0 deg
#
# The few degrees of finger tilt on the top two rows are harmless: the fingers
# close across a 0.03 m book spine with a 0.069 m opening.
#
# ---------------------------- IMPORTANT ----------------------------------
# IK solves reachability, NOT collision. Nothing here checks the arm against
# the shelf, the robot's own body, or the neighbouring books, and there is no
# trajectory planning - the controller interpolates straight to the goal in
# joint space. If the arm clips the shelf on the way in, nudge the pose with
#     ros2 run rafeeq_solution tune_arm
# and paste the result back here.
#
# tucked and carry are still hand-chosen safe postures, not solved.
# -------------------------------------------------------------------------
#
# Joint limits, for reference while tuning (radians):
#   arm_right_1  -4.712 .. +0.524      arm_right_5  -1.571 .. +3.665
#   arm_right_2  -2.443 .. +1.134      arm_right_6  -1.885 .. +3.002
#   arm_right_3  -2.618 .. +2.618      arm_right_7  -2.443 .. +2.443
#   arm_right_4  -2.443 .. +1.134
#   torso_lift    0.000 .. +0.350 m
#   head_1 (pan) -1.309 .. +1.309      head_2 (tilt) -1.047 .. +0.349
#   gripper_*_finger_joint  0.000 .. +0.069 m  (clamped by erc_bringup)

arm_poses:
  # Hand-chosen safe postures for driving.
  tucked:      [-1.50, -1.20,  0.00, -1.40,  0.00,  0.60,  0.00]
  carry:       [-1.40, -0.90,  0.00, -1.20,  0.00,  0.40,  0.00]

  # IK-solved. Gripper at the book centre, approach into the shelf along
  # world +x, fingers horizontal across the 0.03 m spine.
  reach_row_1: [-0.062, +0.950, -0.517, -1.610, -1.282, +0.683, +1.994]
  reach_row_2: [-1.579, +0.723, +0.762, -1.672, +0.270, -0.968, -0.436]
  reach_row_3: [-3.435, -1.100, +2.406, -2.120, -0.819, -1.658, +2.270]
  reach_row_4: [-0.009, +0.369, -0.882, -2.396, +2.023, +2.115, -1.010]

  # IK-solved. Gripper 0.12 m above the bin rim, approaching straight down.
  place:       [-3.852, -1.144, -2.255, -0.225, +2.428, +2.443, -0.380]

# Torso height per row, metres. Row 1 needs every millimetre of lift; the
# bottom row wants the torso all the way down.
torso_by_row:
  1: 0.295
  2: 0.262
  3: 0.266
  4: 0.011

# Torso for non-grasping activities.
torso_poses:
  scan_markers: 0.35    # raise the camera so the plates at 2.26 m fit the
                        # head's limited +0.349 rad upward tilt
  scan_books:   0.20
  drive:        0.10
  place:        0.350   # solved with the place arm pose

# Head pan/tilt pairs, radians. Negative tilt looks down.
head_poses:
  scan_markers: [0.00,  0.32]   # near the +0.349 upward limit
  scan_books:   [0.00, -0.30]
  # scan_bin was -0.25 and pointed the camera at the floor: the bin sits on a
  # table at 1.3 m, which is roughly camera height, not below it. The live run
  # on 2026-08-26 saw only wall and floor with the bin clipped at the right
  # edge of frame, which threw the deprojected bin position out by 0.85 m.
  scan_bin:     [0.00, -0.05]
  forward:      [0.00,  0.00]

# Gripper finger positions, metres. The book spine is 0.03 m wide, so the
# closed value squeezes slightly past contact to load the friction surfaces
# (mu = 5.0 on the book collision, see erc_book.sdf).
gripper:
  open:   0.065
  closed: 0.021
  relax:  0.045

# How long each trajectory is given to execute, seconds.
#
# torso is 12 s, not 4: torso_lift_joint has a velocity limit of 0.035 m/s in
# the URDF, so its full 0.35 m of travel physically takes 10 s. A shorter
# budget makes every torso move report "joints off target".
durations:
  arm:     4.0
  torso:   12.0
  head:    2.0
  gripper: 1.5
